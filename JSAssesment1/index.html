<!DOCTYPE html>
<html lang="en">
<head>
    <title>Simple Calculator</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 shadow">

        <h2 class="text-center">Simple Calculator</h2>

        <!-- Input Fields -->
        <div class="mb-3">
            <label>First Number</label>
            <input type="number" id="num1" class="form-control" />
        </div>

        <div class="mb-3">
            <label>Second Number</label>
            <input type="number" id="num2" class="form-control" />
        </div>

        <!-- Buttons -->
        <div class="d-grid gap-2">

            <button class="btn btn-success" onclick="add()">Add</button>
            <button class="btn btn-primary" onclick="subtract()">Subtract</button>
            <button class="btn btn-warning" onclick="multiply()">Multiply</button>
            <button class="btn btn-danger" onclick="divide()">Divide</button>

        </div>

        <!-- Result -->
        <div class="mt-4 text-center">
            <h4 id="result">Result: </h4>
        </div>

    </div>
</div>

<script src="script.js"></script>

</body>
</html>
